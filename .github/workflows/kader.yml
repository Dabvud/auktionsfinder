name: kader

on:
  schedule:
    - cron: "0 4 1 * *"   # am 1. jedes Monats
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daten
  cancel-in-progress: false

jobs:
  kader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Kader holen
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python -m finder.kader --daten daten

      - name: Daten speichern
        run: |
          git config user.name "auktionsfinder-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git commit -q -m "Kader $(date -u +%Y-%m)"
          for versuch in 1 2 3; do
            git pull --rebase -q && git push -q && exit 0
            sleep 5
          done
          exit 1
